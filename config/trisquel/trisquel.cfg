# Trisquel
# https://trisquel.info

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="iso-scan/filename=${iso_path}"
	bootoptions="file=/cdrom/preseed/trisquel.seed boot=casper quiet splash noprompt fsck.mode=skip"
	linux_path="(loop)/casper/vmlinuz"
	initrd_path="(loop)/casper/initrd"

	menuentry "Try Trisquel GNU/Linux without installing" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions --
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Install Trisquel GNU/Linux" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions only-ubiquity --
		echo Loading initrd...
		initrd $initrd_path
	}
	if [ -f ${linux_path}.netinst ]; then
		menuentry "Install Trisquel GNU/Linux in text mode" {
			set gfxpayload=keep
			linux ${linux_path}.netinst $isocfg vga=788 quiet BOOT_IMAGE=linux --
			initrd ${initrd_path}.netinst
		}
	fi
	menuentry "Check disc for defects" {
		echo Loading kernel...
		linux $linux_path $isocfg boot=casper integrity-check quiet splash --
		echo Loading initrd...
		initrd $initrd_path
	}
}
