# CentOS Stream
# https://www.centos.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="iso-scan/filename=$iso_path"
	bootoptions="inst.stage2=hd:LABEL=$cd_label quiet"
	linux_path="(loop)/images/pxeboot/vmlinuz"
	initrd_path="(loop)/images/pxeboot/initrd.img"

	menuentry "Install CentOS Stream" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Test this media & install CentOS Stream" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions rd.live.check
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Install CentOS Stream in FIPS mode" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions fips=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Install CentOS Stream in basic graphics mode" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Rescue a CentOS Stream system" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions inst.rescue
		echo Loading initrd...
		initrd $initrd_path
	}
}
