# Oracle Linux
# https://www.oracle.com/linux

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="iso-scan/filename=$iso_path"
	bootoptions="inst.stage2=hd:LABEL=$cd_label"
	linux_path="(loop)/images/pxeboot/vmlinuz"
	initrd_path="(loop)/images/pxeboot/initrd.img"

	menuentry "Install Oracle Linux" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions quiet
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Test this media & install Oracle Linux" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions rd.live.check quiet
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Install Oracle Linux in FIPS mode" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions quiet fips=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Install Oracle Linux in basic graphics mode" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset quiet
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Rescue a Oracle Linux system" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions inst.rescue quiet
		echo Loading initrd...
		initrd $initrd_path
	}
}
