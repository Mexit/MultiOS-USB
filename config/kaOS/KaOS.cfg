# KaOS
# https://kaosx.us

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="iso-scan/filename=$iso_path"
	bootoptions="root=live:LABEL=$cd_label rd.live.image rd.live.dir=/kdeos/x86_64 rd.live.squashimg=root-image.sqfs rd.overlay xdriver=no nouveau.modeset=1 i915.modeset=1 radeon.modeset=1"
	linux_path="(loop)/kdeos/boot/x86_64/kdeosiso"
	initrd_path="(loop)/kdeos/boot/x86_64/kdeosiso.img"

	menuentry "KaOS" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nonfree=no
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "KaOS (nonfree Nvidia)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nonfree=yes nvidia_drm.modeset=1
		echo Loading initrd...
		initrd $initrd_path
	}
}
