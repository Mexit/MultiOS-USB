function addLoopbackMenu {
	# $1 - file name (linux.iso)
	# $2 - full path to iso ((hd0,5)/ISOs/linux.iso)
	# $2 - path to iso (/ISOs/linux.iso)
	# $4 - grub or grub2
	# $5 - loopback.cfg - optional
	submenu "$1 (loopback) ->" "$2" "$3" "$4" "$5" {
		if [ -z "$5" ]; then
			cfgfile="loopback.cfg"
		else
			cfgfile="$5"
		fi
		LOOPBACK "$2"
		iso_path="$3"
		export iso_path
		root=(loop)
		configfile /boot/"$4"/"$cfgfile"
	}
}

for file_path in $file_list; do
	regexp --set=1:file_path_rel --set=2:file_name '\([^)]+\)(/.*/([^/]+))$' "$file_path"

	if regexp '\.[iI][sS][oO]$' "$file_name"; then
		LOOPBACK "$file_path"

		if regexp '^(4MLinux|AntivirusLiveCD|BakAndImgCD|TheSSS)-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/4MLinux/4MLinux.cfg
		elif regexp '^AcronisBootableMedia.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/acronis_True_Image/Acronis_True_Image.cfg
		elif regexp '^AerynOS-.*-live-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/aerynOS/aerynOS-live.cfg
		elif regexp '^archbang-.*-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/archbang/archbang.cfg
		elif regexp '^athenaos-live-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/athenaos/athenaos.cfg
		elif regexp '^aurora-.*x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/aurora/aurora.cfg
		elif regexp '^bazzite-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/bazzite/bazzite.cfg
		elif regexp '^bluefin-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/bluefin/bluefin.cfg
		elif regexp '^bslx-.*-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/bluestar/bluestar.cfg
		elif regexp '^CentOS-Stream-.*-x86_64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/centOS/CentOS_Stream.cfg
		elif regexp '^clonezilla-live-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/clonezilla/clonezilla.cfg
		elif regexp '^mini\.iso$' "$file_name"; then
			# Debian mini
			# https://cdimage.debian.org/debian/dists/stable/main/installer-amd64/current/images/netboot/gtk/mini.iso
			# https://cdimage.debian.org/debian/dists/stable/main/installer-amd64/current/images/netboot/mini.iso
			addLoopbackMenu "$file_name" "$file_path" "$file_path_rel" grub grub.cfg
		elif regexp '^dsl-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/damnsmalllinux/damnsmalllinux.cfg
		elif regexp '^Dr.Parted-Live.*-amd64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/dr-parted-live/dr-parted-live.cfg
		elif regexp '^EndeavourOS.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/endeavourOS/endeavourOS.cfg
		elif regexp '^Fedora-.*-Live-.*\.x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/fedora/fedora-live.cfg
		elif regexp '^Fedora-(COSMIC|Everything|Kinoite|Onyx|Sericea|Server|Silverblue)-.*-x86_64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/fedora/fedora.cfg
		elif regexp '^Feren-OS-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/ferenos/ferenos.cfg
		elif regexp '^install-amd64-minimal-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/gentoo/gentoo.cfg
		elif regexp '^livegui-amd64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/gentoo/gentoo-gui.cfg
		elif regexp '^gparted-live-.*-amd64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/gparted/gparted-live.cfg
		elif regexp '^KaOS-.*-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/kaOS/KaOS.cfg
		elif regexp '^Mageia-[0-9]+-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/mageia/Mageia.cfg
		elif regexp '^Mageia-[0-9]+-netinstall-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/mageia/Mageia_netinstall.cfg
		elif regexp '^MocaccinoOS-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/mocaccino/mocaccino.cfg
		elif regexp '^neon-.*-desktop-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/kde_neon/kde_neon.cfg
		elif regexp '^openSUSE-(Tumbleweed|MicroOS)-DVD-x86_64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/openSUSE/openSUSE-DVD.cfg
		elif regexp '^openSUSE-Tumbleweed-NET-x86_64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/openSUSE/openSUSE-NET.cfg
		elif regexp '^OracleLinux-.*-x86_64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/oracleLinux/OracleLinux.cfg
		elif regexp '^Parrot-.*_amd64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/parrotsec/parrot-sec-live.cfg
		elif regexp '^pclinuxos64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/pclinuxos/pclinuxos.cfg
		elif regexp '^ploplinux-.*-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/ploplinux/ploplinux.cfg
		elif regexp '^pmagic_.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/pmagic/pmagic.cfg
		elif regexp '^Qubes-.*-x86_64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/qubes-os/qubes-os.cfg
		elif regexp '^Rocky-.*-x86_64-(boot|dvd.*|minimal)\.iso$' "$file_name"; then
			source /MultiOS-USB/config/rocky/Rocky.cfg
		elif regexp '^Rocky-.*-(KDE|Workstation.*)-x86_64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/rocky/Rocky-live.cfg
		elif regexp '^secureblue-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/secureblue/secureblue.cfg
		elif regexp '^shredos-.*_x86-64_.*\.iso$' "$file_name"; then
			addLoopbackMenu "$file_name" "$file_path" "$file_path_rel" grub grub.cfg
		elif regexp '^slax-64bit-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/slax/slax.cfg
		elif regexp '^Solus-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/solus/solus.cfg
		elif regexp '^tails-amd64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/tails/tails.cfg
		elif regexp '^trisquel.*_amd64\.iso$' "$file_name"; then
			source /MultiOS-USB/config/trisquel/trisquel.cfg
		elif regexp '^ultramarine-.*-live-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/ultramarine/ultramarine-live.cfg
		elif regexp '^void-live-x86_64-.*\.iso$' "$file_name"; then
			source /MultiOS-USB/config/void-linux/void-linux.cfg
		elif [ -f "(loop)/boot/grub/loopback.cfg" ]; then
			addLoopbackMenu "$file_name" "$file_path" "$file_path_rel" grub
		elif [ -f "(loop)/boot/grub2/loopback.cfg" ]; then
			addLoopbackMenu "$file_name" "$file_path" "$file_path_rel" grub2
		elif [ -f "(loop)/sources/boot.wim" ]; then
			source /MultiOS-USB/config/windows/windows_iso.cfg
		fi
	elif regexp '\.[wW][iI][mM]$' "$file_name"; then
		source /MultiOS-USB/config/windows/wim_file.cfg
	fi
done
