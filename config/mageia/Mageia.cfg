# Mageia
# https://www.mageia.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg=""
	bootoptions="automatic=method:disk audit=0 noiswmd vga=791"
	linux_path="(loop)/boot/vmlinuz"
	initrd_path="(loop)/boot/all.rdz"

	menuentry "Start Mageia Install" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions splash quiet
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Start Mageia Rescue" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions rescue
		echo Loading initrd...
		initrd $initrd_path
	}
}
