# ArchBang
# https://archbang.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="img_dev=$imgdevpath img_loop=$iso_path"
	bootoptions="archisobasedir=arch archisolabel=$cd_label cow_spacesize=4G"
	linux_path="(loop)/arch/boot/x86_64/vmlinuz-linux"
	initrd_path="(loop)/arch/boot/x86_64/initramfs-linux.img"

	menuentry "Boot ArchBang" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions
		echo Loading initrd...
		initrd $initrd_path
	}
}
