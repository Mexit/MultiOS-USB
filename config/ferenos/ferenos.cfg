# Feren OS
# https://ferenos.weebly.com

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="iso-scan/filename=${iso_path}"
	bootoptions="file=/cdrom/preseed/ferenos.seed boot=casper debian-installer/language=en_UK keyboard-configuration/layoutcode=gb"
	linux_path="(loop)/casper/vmlinuz"
	initrd_path="(loop)/casper/initrd"

	menuentry "Feren OS" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions quiet splash ---
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Feren OS (nomodeset)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset ---
		echo Loading initrd...
		initrd $initrd_path
	}
}
