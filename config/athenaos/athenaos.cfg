# Athena OS
# https://athenaos.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="img_dev=$imgdevpath img_loop=$iso_path"
	bootoptions="archisobasedir=arch archisolabel=$cd_label cow_spacesize=4G copytoram=n"
	linux_path="(loop)/arch/boot/x86_64/vmlinuz-linux-aegis-offensive"
	initrd_path="(loop)/arch/boot/x86_64/initramfs-linux-aegis-offensive.img"

	menuentry "Athena OS install medium (open source)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nouveau.modeset=1 radeon.modeset=1 i915.modeset=1 nvme_load=yes loglevel=2
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Athena OS install medium (open source) with speech" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nouveau.modeset=1 radeon.modeset=1 i915.modeset=1 nvme_load=yes accessibility=on loglevel=2 systemd.show_status=error
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Athena OS install medium (NVIDIA, nouveau disabled)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions module_blacklist=nouveau radeon.modeset=1 i915.modeset=1 nvme_load=yes loglevel=2
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Athena OS install medium (safe graphics, nomodeset)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset nouveau.modeset=0 radeon.modeset=0 i915.modeset=0 nvme_load=yes loglevel=2
		echo Loading initrd...
		initrd $initrd_path
	}
}
