# Clonezilla Live
# https://clonezilla.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="findiso=$iso_path"
	bootoptions='boot=live union=overlay username=user config loglevel=3 hostname=Clonezilla noswap edd=on enforcing=0 \
				locales= keyboard-layouts= ocs_live_run="ocs-live-general" ocs_live_extra_param="" ocs_live_batch="no"'
	linux_path="(loop)/live/vmlinuz"
	initrd_path="(loop)/live/initrd.img"

	menuentry "Clonezilla live (VGA 800x600)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset vga=788 net.ifnames=0 quiet splash i915.blacklist=yes radeonhd.blacklist=yes nouveau.blacklist=yes vmwgfx.enable_fbdev=1 ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (VGA 800x600 & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset vga=788 toram=live,syslinux,EFI,boot,.disk,utils net.ifnames=0 quiet splash i915.blacklist=yes radeonhd.blacklist=yes nouveau.blacklist=yes vmwgfx.enable_fbdev=1 ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (VGA with large font & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset toram=live,syslinux,EFI,boot,.disk,utils net.ifnames=0 quiet splash live_console_font_size=16x32
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (Verify integrity of the boot medium)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset vga=788 verify-checksums
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (Speech synthesis)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset vga=788 net.ifnames=0 quiet splash i915.blacklist=yes radeonhd.blacklist=yes nouveau.blacklist=yes vmwgfx.enable_fbdev=1 ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1 speakup.synth=soft ---
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (VGA 1024x768)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset vga=791 net.ifnames=0 quiet splash i915.blacklist=yes radeonhd.blacklist=yes nouveau.blacklist=yes vmwgfx.enable_fbdev=1 ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (VGA 640x480)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset vga=785 net.ifnames=0 quiet splash i915.blacklist=yes radeonhd.blacklist=yes nouveau.blacklist=yes vmwgfx.enable_fbdev=1 ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (KMS)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions vga=791 net.ifnames=0 quiet splash
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (KMS & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions vga=791 toram=live,syslinux,EFI,boot,.disk,utils net.ifnames=0 quiet splash
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (KMS with large font & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions vga=791 toram=live,syslinux,EFI,boot,.disk,utils net.ifnames=0 quiet splash live_console_font_size=16x32
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live Safe graphic settings (vga=normal)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions net.ifnames=0 nomodeset vga=normal nosplash
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Clonezilla live (Failsafe mode)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions acpi=off irqpoll noapic noapm nodma nomce nolapic nosmp net.ifnames=0 nomodeset vga=normal nosplash
		echo Loading initrd...
		initrd $initrd_path
	}
}
