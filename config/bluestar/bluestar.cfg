# Bluestar Linux
# https://sourceforge.net/projects/bluestarlinux

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="img_dev=$imgdevpath img_loop=$iso_path"
	bootoptions="archisobasedir=arch archisolabel=$cd_label ipv6.disable=1 copytoram=no nvidia.modeset=0 nvidia_drm.modeset=0 \
				xe.modeset=0 i915.modeset=0 amdgpu.modeset=0 radeon.modeset=0 nouveau.modeset=0 video=efifb:1920x1080-32 \
				initcall_blacklist=i915_init,amdgpu_init,radeon_init,nouveau_init,nvidia_init,nvidia_drm_init,xe_init"
	linux_path="(loop)/arch/boot/x86_64/vmlinuz"
	initrd_path="(loop)/arch/boot/x86_64/archiso.img (loop)/arch/boot/amd_ucode.img (loop)/arch/boot/intel_ucode.img"

	menuentry "Boot Bluestar Linux" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions
		echo Loading initrd...
		initrd $initrd_path
	}
}
