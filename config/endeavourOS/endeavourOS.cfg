# EndeavourOS
# https://endeavouros.com

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="img_dev=$imgdevpath img_loop=$iso_path"
	bootoptions="archisolabel=$cd_label archisobasedir=arch cow_spacesize=10G copytoram=n"
	linux_path="(loop)/arch/boot/x86_64/vmlinuz-linux"
	initrd_path="(loop)/arch/boot/x86_64/initramfs-linux.img"

	menuentry "EndeavourOS with open source drivers: All GPUs" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions module_blacklist=pcspkr,nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm systemd.mask=nvidia-persistenced.service nouveau.modeset=1 i915.modeset=1 radeon.modeset=1 nvme_load=yes nouveau-boot
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "EndeavourOS with NVIDIA drivers: Only RTX GPUs, Turing, or later" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions module_blacklist=pcspkr,nouveau,nouveau_drm nouveau.modeset=0 nvidia_drm.modeset=1 i915.modeset=1 radeon.modeset=1 nvme_load=yes nvidia=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "EndeavourOS fallback nomodeset" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions module_blacklist=pcspkr nomodeset nvme_load=yes
		echo Loading initrd...
		initrd $initrd_path
	}
}
