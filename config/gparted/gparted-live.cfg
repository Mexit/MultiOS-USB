# GParted
# https://gparted.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="findiso=$iso_path"
	bootoptions="boot=live union=overlay username=user config components loglevel=3 noswap"
	linux_path="(loop)/live/vmlinuz"
	initrd_path="(loop)/live/initrd.img"

	menuentry "GParted Live (Default settings)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions net.ifnames=0 nosplash ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live (Default settings & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions toram=filesystem.squashfs net.ifnames=0 nosplash ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live (VGA with large font & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset toram=filesystem.squashfs net.ifnames=0 nosplash live_console_font_size=16x32
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live (Verify integrity of the boot medium)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions verify-checksums
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live (KMS)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions vga=791 net.ifnames=0 nosplash
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live (KMS & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions vga=791 toram=filesystem.squashfs net.ifnames=0 nosplash
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live (KMS with large font & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions vga=791 toram=filesystem.squashfs net.ifnames=0 nosplash live_console_font_size=16x32
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live Safe graphic settings (vga=normal)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions net.ifnames=0 nomodeset vga=normal nosplash
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "GParted Live (Failsafe mode)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions acpi=off irqpoll noapic noapm nodma nomce nolapic nosmp net.ifnames=0 nomodeset vga=normal nosplash
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Memtester (Default settings & To RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions toram=filesystem.squashfs net.ifnames=0 nosplash ocs_1_cpu_udev scsi_mod.use_blk_mq=0 nvme.poll_queues=1 init=/bin/bash -- -c "/sbin/ocs-memtester"
		echo Loading initrd...
		initrd $initrd_path
	}
}
