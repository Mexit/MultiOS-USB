# Tails
# https://tails.net

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="findiso=$iso_path"
	bootoptions="boot=live config nopersistence noprompt timezone=Etc/UTC splash noautologin module=Tails slab_nomerge slub_debug=FZ mce=0 vsyscall=none init_on_free=1 mds=full,nosmt page_alloc.shuffle=1 randomize_kstack_offset=on efi_pstore.pstore_disable=1 erst_disable spec_store_bypass_disable=on systemd.condition_needs_update=no proc_mem.force_override=ptrace"
	linux_path="(loop)/live/vmlinuz"
	initrd_path="(loop)/live/initrd.img"

	menuentry "Tails" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions live-media=removable quiet
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Tails (Troubleshooting Mode)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions live-media=removable noapic noapm nodma nomce nolapic nosmp
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Tails (External Hard Disk)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions quiet
		echo Loading initrd...
		initrd $initrd_path
	}
}
