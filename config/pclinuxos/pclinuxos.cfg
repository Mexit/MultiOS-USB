# For PCLinuxOS
# https://www.pclinuxos.com

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="bootfromiso=$iso_path root=(loop)"
	bootoptions="livecd=livecd vga=788 keyb=us"
	linux_path="(loop)/isolinux/vmlinuz"
	initrd_path="(loop)/isolinux/initrd.gz"

	menuentry "Start PCLinuxOS Live (No Boot Splash)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions quiet splash=verbose
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Start PCLinuxOS Live (Video - Modesetting)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions quiet splash=verbose xdriver=modesetting
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Start PCLinuxOS Live (Safe Mode)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions acpi=off noapic nolapic nopinit xdriver=modesetting
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Start PCLinuxOS Live (Copy to RAM)" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions copy2ram quiet splash=verbose
		echo Loading initrd...
		initrd $initrd_path
	}
}
