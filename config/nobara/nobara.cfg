# Nobara
# https://nobaraproject.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	probe --label --set=cd_label (loop)
	isocfg="iso-scan/filename=$iso_path"
	bootoptions="root=live:CDLABEL=$cd_label modules_load=nvidia rd.live.image quiet rhgb"
	linux_path="(loop)/images/pxeboot/vmlinuz"
	initrd_path="(loop)/images/pxeboot/initrd.img"

	menuentry "Start Nobara Live" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Test this media & start Nobara Live" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions rd.live.check
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Start Nobara Live in basic graphics mode" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset vga=791
		echo Loading initrd...
		initrd $initrd_path
	}
}
