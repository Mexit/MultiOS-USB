# Fedora COSMIC, Everything, Kinoite, Onyx, Sericea, Server, Silverblue
# https://fedoraproject.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	search --file --no-floppy --set=isopart $iso_path
	probe --fs-uuid --set=isouuid ($isopart)
	bootoptions="inst.stage2=hd:UUID=$isouuid:$iso_path quiet"
	linux_path="(loop)/images/pxeboot/vmlinuz"
	initrd_path="(loop)/images/pxeboot/initrd.img"

	menuentry "Install Fedora" {
		echo Loading kernel...
		linux $linux_path $bootoptions
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Test this media & install Fedora" {
		echo Loading kernel...
		linux $linux_path $bootoptions rd.live.check
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Install Fedora in basic graphics mode" {
		echo Loading kernel...
		linux $linux_path $bootoptions nomodeset
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Rescue a Fedora system" {
		echo Loading kernel...
		linux $linux_path $bootoptions inst.rescue
		echo Loading initrd...
		initrd $initrd_path
	}
}
