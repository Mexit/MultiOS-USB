# Plop Linux
# https://www.plop.at

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="iso_filename=$iso_path"
	bootoptions=""
	linux_path="(loop)/syslinux/kernel/bzImage"
	initrd_path="(loop)/syslinux/kernel/initramfs.gz"

	menuentry "Plop Linux" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Plop Linux text mode" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Plop Linux + copy to ram" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions copy2ram
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "Plop Linux text mode + copy to ram" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset copy2ram
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "PlopKexec (Boot Manager)" {
		echo Loading PlopKexec...
		linux (loop)/syslinux/plop/plopkexec64
	}

	if [ "${grub_platform}" == "pc" ]; then

		menuentry "Plop Boot Manager 5" {
			echo Loading plpbt...
			linux16 (loop)/syslinux/plop/plpbt.bin
		}
		menuentry "Plop Boot Manager 5 with pcmcia" {
			echo Loading plpbt...
			linux16 (loop)/syslinux/plop/pcmcia/plpbt.bin
		}
		menuentry "Plop Boot Manager 6" {
			echo Loading pbm6...
			linux (loop)/syslinux/plop/pbm6
		}
	fi
}
