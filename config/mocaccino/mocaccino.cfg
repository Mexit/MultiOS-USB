# MocaccinoOS
# https://www.mocaccino.org

submenu "$file_name ->" "$file_path" "$file_path_rel" {
	LOOPBACK "$2"
	iso_path="$3"
	isocfg="iso-scan/filename=$iso_path"
	bootoptions="cdroot rootdelay=7"
	linux_path="(loop)/boot/kernel.xz"
	initrd_path="(loop)/boot/rootfs.xz"

	menuentry "MocaccinoOS Linux Live" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions
		echo Loading initrd...
		initrd $initrd_path
	}
	menuentry "MocaccinoOS (safe graphics) Linux Live" {
		echo Loading kernel...
		linux $linux_path $isocfg $bootoptions nomodeset plymouth.enable=0
		echo Loading initrd...
		initrd $initrd_path
	}
}
