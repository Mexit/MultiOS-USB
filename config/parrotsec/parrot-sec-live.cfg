# Parrot-Sec
# https://www.parrotsec.org

iso_pattern="Parrot-*_amd64.iso"

for isofile in ($dev,*)$iso_dir/$iso_pattern; do
	if [ -e "$isofile" ]; then
		regexp --set=isoname "$iso_dir/(.*)" "$isofile"

		submenu "$isoname ->" "$isofile" "$iso_dir/$isoname" {
			iso_path="$3"
			LOOPBACK "$2"
			isocfg="findiso=$iso_path"
			bootoptions="boot=live hostname=parrot quiet splash components noautomount"
			linux_path="(loop)/live/vmlinuz"
			initrd_path="(loop)/live/initrd.img"

			menuentry "Try / Install" {
					echo Loading kernel...
					linux $linux_path $isocfg $bootoptions noeject
					echo Loading initrd...
					initrd $initrd_path
			}
			menuentry "RAM mode" {
					echo Loading kernel...
					linux $linux_path $isocfg $bootoptions toram noeject
					echo Loading initrd...
					initrd $initrd_path
			}
			menuentry "Persistence (needs configuration)" {
					echo Loading kernel...
					linux $linux_path $isocfg $bootoptions persistence
					echo Loading initrd...
					initrd $initrd_path
			}
			menuentry "Encrypted persistence (needs configuration)" {
					echo Loading kernel...
					linux $linux_path $isocfg $bootoptions persistent=cryptsetup persistence-encryption=luks persistence
					echo Loading initrd...
					initrd $initrd_path
			}
			menuentry "Disable Nvidia GPU" {
					echo Loading kernel...
					linux $linux_path $isocfg $bootoptions nouveau.modeset=0 nvidia.modeset=0
					echo Loading initrd...
					initrd $initrd_path
			}
			menuentry "Failsafe-gpu (GPU nomodeset)" {
					echo Loading kernel...
					linux $linux_path $isocfg $bootoptions nomodeset
					echo Loading initrd...
					initrd $initrd_path
			}
			menuentry "Failsafe-hw (HW compatibility issues)" {
					echo Loading kernel...
					linux $linux_path $isocfg $bootoptions config memtest noapic noapm nodma nomce nolapic nomodeset noquiet splash components vga=normal
					echo Loading initrd...
					initrd $initrd_path
			}
		}
	fi
done
